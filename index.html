<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobiliário Interativo 3D</title>
    <!-- Biblioteca oficial estável -->
    <script type="module" src="https://googleapis.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f4f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 90vw;
            height: 85vh;
            max-width: 1100px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            padding: 24px;
            display: flex;
            flex-direction: column;
        }
        h1 { font-size: 1.25rem; color: #1a1a1a; margin-bottom: 12px; font-weight: 500; }
        model-viewer { 
            width: 100%; 
            height: 100%; 
            background-color: #fafafa; 
            border-radius: 8px; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Visualização Interativa de Mobiliário</h1>
        
        <!-- Adicionado ./ no src para o servidor do GitHub localizar sem restrição -->
        <model-viewer 
            src="./3dExport-mob-1.glb" 
            ar
            ar-modes="webxr scene-viewer quick-look" 
            camera-controls 
            auto-rotate 
            shadow-intensity="1.5" 
            shadow-softness="1"
            exposure="1.2"
            crossorigin="anonymous"
            alt="Modelo 3D do meu mobiliário">
        </model-viewer>
    </div>

</body>
</html>
