<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesa de Cabeceira - RDESK DESIGN</title>
    
    <!-- CSS para fazer o visualizador ocupar 100% da tela -->
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121212; /* Fundo escuro (Aesthetics Industrial/Dark) */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            /* Remove o outline azul feio quando o usuário clica */
            --poster-color: transparent;
        }
    </style>
</head>
<body>

    <!-- Componente model-viewer apontando para o seu arquivo GLB -->
    <model-viewer 
    src="models/mesa-cabeceira.glb" 
    alt="Mesa de Cabeceira Industrial" 
    auto-rotate 
    camera-controls 
    ar 
    shadow-intensity="1"
    shadow-softness="1"
    exposure="1.2"
    environment-image="https://modelviewer.dev/shared-assets/environments/spruit_sunrise_1k_HDR.hdr">
        </model-viewer>

    <!-- Script oficial do Google Model Viewer -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

</body>
</html>
